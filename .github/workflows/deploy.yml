name: deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: npm

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Assets
        run: npm run build

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: sv17172.xserver.jp
          username: xs383211
          key: ${{ secrets.XSERVER_SSH_KEY }}
          port: '10022'
          timeout: 60s
          command_timeout: 10m
          use_insecure_cipher: true
          script: |
            set -e
            cd ~/xs383211.xsrv.jp/fumikura
            git pull --ff-only origin main
            php8.4 artisan view:clear
            php8.4 artisan config:clear
            php8.4 artisan route:clear
            php8.4 artisan migrate --force --no-interaction

      - name: Upload built assets
        uses: appleboy/scp-action@v1.0.0
        with:
          host: sv17172.xserver.jp
          username: xs383211
          key: ${{ secrets.XSERVER_SSH_KEY }}
          port: '10022'
          timeout: 60s
          use_insecure_cipher: true
          source: 'public/build/*'
          target: /home/xs383211/xs383211.xsrv.jp/fumikura/public/build
          strip_components: 2
          overwrite: true
          rm: true

      - name: Fix asset permissions
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: sv17172.xserver.jp
          username: xs383211
          key: ${{ secrets.XSERVER_SSH_KEY }}
          port: '10022'
          timeout: 60s
          use_insecure_cipher: true
          script: |
            set -e
            cd ~/xs383211.xsrv.jp/fumikura
            find public/build -type d -exec chmod 755 {} \;
            find public/build -type f -exec chmod 644 {} \;
